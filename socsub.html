<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS Exam 2026 - Question Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #f5c518;
    --accent2: #ffd700;
    --text: #e8eaf0;
    --muted: #8b92a5;
    --border: #2e3347;
    --done-color: #2ecc71;
    --mark2: #3b82f6;
    --mark4: #a855f7;
    --mark6: #ef4444;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 2px solid var(--accent);
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .header-left h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .header-left p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .countdown-badge {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 20px;
    animation: pulse 2s infinite;
    white-space: nowrap;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .total-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.8rem;
    padding: 6px 14px;
    border-radius: 20px;
  }
  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--surface);
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar-outer {
    background: var(--surface2);
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done-color));
    border-radius: 10px;
    transition: width 0.5s ease;
    width: 0%;
  }
  /* CONTROLS */
  .controls {
    background: var(--surface);
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.88rem;
    padding: 9px 16px 9px 38px;
    border-radius: 8px;
    outline: none;
    transition: border 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
  }
  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .chapter-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    min-width: 160px;
  }
  .chapter-select option { background: var(--surface); }
  /* LAYOUT */
  .main-layout {
    display: flex;
    max-width: 1400px;
    margin: 0 auto;
  }
  /* SIDEBAR */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    padding: 20px 0;
    position: sticky;
    top: 180px;
    height: calc(100vh - 180px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sidebar-title {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 16px 10px;
  }
  .sidebar-part {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    padding: 8px 16px 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .sidebar-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 16px;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    border-radius: 0 8px 8px 0;
    margin-right: 8px;
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .sidebar-link:hover, .sidebar-link.active {
    background: var(--surface2);
    color: var(--text);
    border-left-color: var(--accent);
  }
  .sidebar-count {
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }
  /* CONTENT */
  .content {
    flex: 1;
    padding: 24px 20px;
    min-width: 0;
  }
  .chapter-section {
    margin-bottom: 40px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chapter-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }
  .chapter-num {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .chapter-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .chapter-qcount {
    background: var(--surface2);
    border: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    color: var(--muted);
    margin-left: auto;
    flex-shrink: 0;
  }
  /* MARK GROUPS */
  .mark-group {
    margin-bottom: 18px;
  }
  .mark-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .mark-pill {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 6px;
    color: #fff;
  }
  .pill-2 { background: var(--mark2); }
  .pill-4 { background: var(--mark4); }
  .pill-6 { background: var(--mark6); }
  /* QUESTION CARD */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: all 0.2s;
    position: relative;
  }
  .q-card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .q-card.done {
    opacity: 0.45;
    background: #1a2a1a;
    border-color: var(--done-color);
  }
  .q-card.done .q-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .q-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .q-checkbox {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    cursor: pointer;
    accent-color: var(--done-color);
  }
  .q-body { flex: 1; min-width: 0; }
  .q-text {
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text);
    font-weight: 400;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .badge-marks {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 6px;
    color: #fff;
  }
  .badge-repeat {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 6px;
    background: #2a1a00;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .copy-btn {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .copy-btn.copied {
    background: var(--done-color);
    color: #000;
    border-color: var(--done-color);
  }
  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main-layout { flex-direction: column; }
    .content { padding: 16px 12px; }
    .header { padding: 14px 16px; }
    .controls { padding: 12px 16px; }
    .chapter-title { font-size: 0.95rem; }
  }
  /* HIDDEN */
  .hidden { display: none !important; }
  /* SCROLL OFFSET */
  .chapter-anchor { scroll-margin-top: 180px; }
  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <h1>📚 SS Exam 2026 — Question Bank</h1>
    <p>Class 10 Social Studies · Telangana Board · Pre-Final 2026</p>
  </div>
  <div class="header-right">
    <span class="total-badge" id="totalQCount">Loading…</span>
    <span class="countdown-badge" id="countdown">⏰ Loading…</span>
  </div>
</header>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-info">
    <span>📝 Progress: <strong id="doneCount">0</strong> / <strong id="totalCount">0</strong> questions done</span>
    <span id="donePercent">0%</span>
  </div>
  <div class="progress-bar-outer">
    <div class="progress-bar-inner" id="progressBar"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search questions by keyword…" oninput="filterAll()">
  </div>
  <div class="filter-group">
    <button class="filter-btn active" onclick="setMarkFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setMarkFilter('2', this)">2 Mark</button>
    <button class="filter-btn" onclick="setMarkFilter('4', this)">4 Mark</button>
    <button class="filter-btn" onclick="setMarkFilter('6', this)">6 Mark</button>
  </div>
  <select class="chapter-select" id="chapterJump" onchange="jumpToChapter(this.value)">
    <option value="">— Jump to Chapter —</option>
  </select>
</div>

<!-- LAYOUT -->
<div class="main-layout">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">Chapters</div>
  </nav>

  <!-- CONTENT -->
  <main class="content" id="mainContent">
    <div class="no-results hidden" id="noResults">
      <div style="font-size:2rem;">🔍</div>
      <p style="margin-top:10px;">No questions match your search.</p>
    </div>
  </main>
</div>

// QUESTION DATA — All questions extracted, classified, deduped

// Q format: { ch, marks, text, repeat }
// repeat = number of times it appeared across papers (1 = appeared once)
const QUESTIONS = [

  // ─── CH 1: India Relief Features ───────────────────────────────────────
  { ch:1, marks:2, repeat:3, text:"What are the major relief divisions of India?" },
  { ch:1, marks:2, repeat:2, text:"Name the ranges of the Himalayas." },

// ============================================================
// STATE
// ============================================================
let markFilter = 'all';
let doneSet = new Set(JSON.parse(localStorage.getItem('doneQ') || '[]'));

function saveProgress() {
  localStorage.setItem('doneQ', JSON.stringify([...doneSet]));
}

// ============================================================
// COUNTDOWN
// ============================================================
function updateCountdown() {
 const exam = new Date('2026-04-13T09:30:00');
  const now = new Date();
  const diff = exam - now;
  if (diff <= 0) { document.getElementById('countdown').textContent = '⏰ Exam Day!'; return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  document.getElementById('countdown').textContent = `⏰ ${d}d ${h}h ${m}m Left`;
}
updateCountdown();
setInterval(updateCountdown, 60000);

// ============================================================
// BUILD SIDEBAR & CHAPTER SELECT
// ============================================================
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const jumpSelect = document.getElementById('chapterJump');
  let currentPart = 0;

  CHAPTERS.forEach(ch => {
    const qs = getChapterQs(ch.id);
    if (qs.length === 0 && ch.id !== 99) return;
    if (qs.length === 0) return;

    if (ch.part !== currentPart) {
      currentPart = ch.part;
      const pd = document.createElement('div');
      pd.className = 'sidebar-part';
      pd.textContent = PARTS[ch.part];
      sidebar.appendChild(pd);
    }

    const link = document.createElement('div');
    link.className = 'sidebar-link';
    link.id = `slink-${ch.id}`;
    link.innerHTML = `<span>${ch.num}: ${ch.title}</span><span class="sidebar-count">${qs.length}</span>`;
    link.onclick = () => {
      document.getElementById(`ch-${ch.id}`)?.scrollIntoView({ behavior:'smooth' });
    };
    sidebar.appendChild(link);

    const opt = document.createElement('option');
    opt.value = ch.id;
    opt.textContent = `${ch.num}: ${ch.title}`;
    jumpSelect.appendChild(opt);
  });
}

function getChapterQs(chId) {
  return QUESTIONS.filter(q => q.ch === chId);
}

// ============================================================
// RENDER
// ============================================================
function qKey(q) {
  return q.ch + '|' + q.marks + '|' + q.text.slice(0, 60);
}

function renderAll() {
  const content = document.getElementById('mainContent');
  content.innerHTML = '';
  const noRes = document.createElement('div');
  noRes.className = 'no-results hidden';
  noRes.id = 'noResults';
  noRes.innerHTML = '<div style="font-size:2rem;">🔍</div><p style="margin-top:10px;">No questions match your search.</p>';
  content.appendChild(noRes);

  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  let totalVisible = 0;

  CHAPTERS.forEach(ch => {
    let qs = getChapterQs(ch.id);
    if (!qs.length) return;

    // filter by marks
    if (markFilter !== 'all') {
      qs = qs.filter(q => q.marks === parseInt(markFilter));
    }
    // filter by search
    if (search) {
      qs = qs.filter(q => q.text.toLowerCase().includes(search));
    }
    if (!qs.length) return;

    totalVisible += qs.length;

    // sort: repeat desc, then marks desc
    qs = [...qs].sort((a,b) => (b.repeat - a.repeat) || (b.marks - a.marks));

    const section = document.createElement('div');
    section.className = 'chapter-section chapter-anchor';
    section.id = `ch-${ch.id}`;

    // header
    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = `
      <span class="chapter-num">${ch.num}</span>
      <span class="chapter-title">${ch.title}</span>
      <span class="chapter-qcount">${qs.length} Q</span>
    `;
    section.appendChild(header);

    // group by marks
    [2, 4, 6].forEach(m => {
      const mqs = qs.filter(q => q.marks === m);
      if (!mqs.length) return;

      const grp = document.createElement('div');
      grp.className = 'mark-group';

      const grpHdr = document.createElement('div');
      grpHdr.className = 'mark-group-header';
      grpHdr.innerHTML = `<span class="mark-pill pill-${m}">${m}M</span> ${m}-Mark Questions (${mqs.length})`;
      grp.appendChild(grpHdr);

      mqs.forEach(q => {
        const key = qKey(q);
        const isDone = doneSet.has(key);
        const card = document.createElement('div');
        card.className = `q-card ${isDone ? 'done' : ''}`;
        card.dataset.key = key;

        const pillClass = m === 2 ? 'mark2' : m === 4 ? 'mark4' : 'mark6';
        const pillColor = m === 2 ? '#3b82f6' : m === 4 ? '#a855f7' : '#ef4444';

        card.innerHTML = `
          <div class="q-top">
            <input type="checkbox" class="q-checkbox" ${isDone ? 'checked' : ''} onchange="toggleDone('${key.replace(/'/g,"\\'")}', this)">
            <div class="q-body">
              <div class="q-text">${escapeHtml(q.text)}</div>
              <div class="q-meta">
                <span class="badge-marks" style="background:${pillColor}">${m}M</span>
                ${q.repeat > 1 ? `<span class="badge-repeat">🔁 ${q.repeat}× repeated</span>` : ''}
                <button class="copy-btn" onclick="copyPrompt(this, '${escapeForAttr(q.text)}', ${m})">📋 Copy Prompt</button>
              </div>
            </div>
          </div>
        `;
        grp.appendChild(card);
      });

      section.appendChild(grp);
    });

    content.appendChild(section);
  });

  if (totalVisible === 0) {
    noRes.classList.remove('hidden');
  }

  updateProgress();
  updateTotalBadge();
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeForAttr(t) {
  return t.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,' ');
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleDone(key, cb) {
  const card = cb.closest('.q-card');
  if (cb.checked) {
    doneSet.add(key);
    card.classList.add('done');
  } else {
    doneSet.delete(key);
    card.classList.remove('done');
  }
  saveProgress();
  updateProgress();
}

function updateProgress() {
  const allCards = document.querySelectorAll('.q-card');
  const total = allCards.length;
  const done = document.querySelectorAll('.q-card.done').length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('donePercent').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function updateTotalBadge() {
  const total = QUESTIONS.length;
  document.getElementById('totalQCount').textContent = `📚 ${total} Questions`;
}

function setMarkFilter(val, btn) {
  markFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
}

function filterAll() {
  renderAll();
}

function jumpToChapter(chId) {
  if (!chId) return;
  const el = document.getElementById(`ch-${chId}`);
  if (el) el.scrollIntoView({ behavior:'smooth' });
}

function copyPrompt(btn, questionText, marks) {
  const sentences = marks === 2 ? '3-4' : marks === 4 ? '5-6' : '8-10';
  const prompt = `Generate a Class 10 board exam answer for: ${questionText}. Marks: ${marks}. Keep it simple, ${sentences} sentences.`;
  navigator.clipboard.writeText(prompt).then(() => {
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copy Prompt';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy Prompt'; }, 2000);
  });
}

// ============================================================
// INIT
// ============================================================
buildSidebar();
renderAll();
</script>
