<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Studies Quiz — Class X</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #fdf9f0;
    --yellow-hl: #fff176;
    --pink-hl: #ffb3c6;
    --green-hl: #b8f5b1;
    --red: #ff6b6b;
    --ink: #1a1a2e;
    --mid: #555577;
    --card: #fffef8;
    --border: #d4c9a8;
    --blue-hl: #b3d9ff;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, #e8e0cc 27px, #e8e0cc 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, #ede5d0 27px, #ede5d0 28px);
  }

  /* SCREEN MANAGEMENT */
  .screen { display: none; width: 100%; max-width: 720px; }
  .screen.active { display: block; }

  /* WELCOME SCREEN */
  .welcome-card {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    padding: 50px 44px 44px;
    transform: rotate(-0.8deg);
    box-shadow: 6px 6px 0 var(--ink);
    position: relative;
  }
  .welcome-card::before {
    content: '';
    position: absolute;
    top: 12px; left: -4px;
    width: 8px; height: calc(100% - 24px);
    background: var(--pink-hl);
    border-radius: 2px;
  }
  .subject-tag {
    font-family: 'Caveat', cursive;
    font-size: 15px;
    background: var(--yellow-hl);
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
    transform: rotate(1deg);
    font-weight: 600;
  }
  .welcome-title {
    font-family: 'Caveat', cursive;
    font-size: 52px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .welcome-sub {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--mid);
    margin-bottom: 28px;
  }
  .welcome-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .meta-chip {
    background: var(--blue-hl);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 14px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .doodle {
    font-family: 'Caveat', cursive;
    position: absolute;
    color: var(--mid);
    opacity: 0.55;
    font-size: 13px;
    transform: rotate(-15deg);
    bottom: 18px; right: 24px;
  }
  .start-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 16px 44px;
    font-size: 20px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--pink-hl);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.5px;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 0 var(--pink-hl); }
  .start-btn:active { transform: translateY(1px); box-shadow: 2px 2px 0 var(--pink-hl); }

  /* QUIZ SCREEN */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .score-badge {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    font-weight: 700;
    background: var(--yellow-hl);
    border: 2px solid var(--ink);
    border-radius: 20px;
    padding: 4px 14px;
  }
  .q-counter {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: var(--mid);
  }
  .progress-bar-wrap {
    background: #e5deca;
    border-radius: 999px;
    height: 10px;
    margin-bottom: 20px;
    border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .question-card {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    padding: 32px 30px 28px;
    box-shadow: 5px 5px 0 var(--ink);
    margin-bottom: 18px;
    position: relative;
    transition: transform 0.15s;
  }
  .question-card.rotate-neg { transform: rotate(-0.5deg); }
  .question-card.rotate-pos { transform: rotate(0.5deg); }

  .q-num-tag {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    background: var(--pink-hl);
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 10px;
    font-weight: 600;
    transform: rotate(-1deg);
  }
  .q-text {
    font-size: 17.5px;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 500;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 540px) { .options-grid { grid-template-columns: 1fr; } }

  .option-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s, background 0.12s;
    box-shadow: 2px 2px 0 var(--border);
    line-height: 1.45;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 3px 5px 0 var(--border);
    border-color: var(--ink);
  }
  .option-btn .opt-label {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 17px;
    min-width: 22px;
    color: var(--mid);
  }
  .option-btn.selected {
    border-color: var(--ink);
    background: #f0ecff;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .option-btn.correct {
    background: var(--green-hl);
    border-color: #2e7d32;
    box-shadow: 3px 3px 0 #2e7d32;
  }
  .option-btn.wrong {
    background: #ffe0e0;
    border-color: var(--red);
    box-shadow: 3px 3px 0 var(--red);
  }
  .option-btn:disabled { cursor: default; }

  .lock-in-btn {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    background: var(--ink);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--yellow-hl);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.5px;
  }
  .lock-in-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 5px 6px 0 var(--yellow-hl); }
  .lock-in-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 2px 2px 0 var(--yellow-hl); }
  .lock-in-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .feedback-box {
    margin-top: 14px;
    padding: 14px 18px;
    border-radius: 8px;
    border: 2px solid;
    font-size: 15px;
    line-height: 1.5;
    display: none;
  }
  .feedback-box.correct-fb { background: var(--green-hl); border-color: #2e7d32; }
  .feedback-box.wrong-fb { background: #ffe0e0; border-color: var(--red); }
  .feedback-box .fb-title {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .feedback-box .fb-explain { color: #333; }
  .feedback-box .fb-correct-ans {
    margin-top: 6px;
    font-weight: 600;
    color: #2e7d32;
  }

  .next-btn {
    margin-top: 12px;
    width: 100%;
    padding: 13px;
    font-size: 18px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.12s;
    display: none;
  }
  .next-btn:hover { transform: translateY(-2px); }

  /* SHAKE */
  @keyframes shake {
    0%,100%{transform:translateX(0) rotate(var(--r,0deg))}
    20%{transform:translateX(-8px) rotate(var(--r,0deg))}
    40%{transform:translateX(8px) rotate(var(--r,0deg))}
    60%{transform:translateX(-5px) rotate(var(--r,0deg))}
    80%{transform:translateX(5px) rotate(var(--r,0deg))}
  }
  .shake { animation: shake 0.45s ease; }

  /* GREEN FLASH */
  @keyframes greenFlash {
    0%{background:var(--card)}
    30%{background:#d4f7d0}
    100%{background:var(--card)}
  }
  .flash-green { animation: greenFlash 0.6s ease; }

  /* END SCREEN */
  .end-card {
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 10px;
    padding: 50px 40px 44px;
    box-shadow: 8px 8px 0 var(--ink);
    text-align: center;
    transform: rotate(0.5deg);
    position: relative;
  }
  .end-title {
    font-family: 'Caveat', cursive;
    font-size: 52px;
    font-weight: 700;
    margin-bottom: 10px;
    line-height: 1.1;
  }
  .end-score {
    font-family: 'Caveat', cursive;
    font-size: 70px;
    font-weight: 700;
    background: var(--yellow-hl);
    display: inline-block;
    padding: 0 20px;
    border-radius: 8px;
    margin: 14px 0;
    transform: rotate(-1deg);
  }
  .end-grade {
    font-family: 'Caveat', cursive;
    font-size: 28px;
    margin: 10px 0 28px;
    display: inline-block;
    padding: 4px 16px;
    border-radius: 6px;
  }
  .grade-excellent { background: var(--green-hl); }
  .grade-good { background: var(--blue-hl); }
  .grade-keep { background: var(--pink-hl); }

  .retry-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 16px 44px;
    font-size: 22px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--pink-hl);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .retry-btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 0 var(--pink-hl); }

  .kb-hint {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--mid);
    font-family: 'Caveat', cursive;
    font-size: 15px;
  }

  .tape {
    width: 56px; height: 18px;
    background: rgba(255,241,118,0.7);
    border: 1px solid rgba(180,160,0,0.3);
    border-radius: 2px;
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
  }
</style>
</head>
<body>

<!-- WELCOME -->
<div class="screen active" id="screen-welcome">
  <div class="welcome-card">
    <div class="tape"></div>
    <div class="subject-tag">📚 SSC Pre-Final 2026</div>
    <div class="welcome-title">Social Studies Quiz</div>
    <div class="welcome-sub">Class X — All Districts Combined</div>
    <div class="welcome-meta">
      <div class="meta-chip">📝 <span id="total-count">?</span> Questions</div>
      <div class="meta-chip">🗺️ Geography · History · Civics · Economics</div>
      <div class="meta-chip">⏱️ No time limit</div>
    </div>
    <button class="start-btn" onclick="startQuiz()">Let's Go! →</button>
    <div class="doodle">good luck!! ✨</div>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <div class="q-counter" id="q-counter">Q 1 / 120</div>
    <div class="score-badge">⭐ <span id="score-display">0</span></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="question-card rotate-neg" id="question-card">
    <div class="tape"></div>
    <div class="q-num-tag" id="q-num-tag">Q1</div>
    <div class="q-text" id="q-text"></div>
  </div>
  <div class="options-grid" id="options-grid"></div>
  <button class="lock-in-btn" id="lock-in-btn" onclick="lockIn()" disabled>Lock In 🔒</button>
  <div class="feedback-box" id="feedback-box">
    <div class="fb-title" id="fb-title"></div>
    <div class="fb-correct-ans" id="fb-correct-ans"></div>
    <div class="fb-explain" id="fb-explain"></div>
  </div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
  <div class="kb-hint">Keyboard: 1/2/3/4 to pick · Enter to lock in</div>
</div>

<!-- END -->
<div class="screen" id="screen-end">
  <div class="end-card">
    <div class="tape"></div>
    <div class="end-title">Done! 🎉</div>
    <div>You scored</div>
    <div class="end-score" id="end-score">0 / 0</div>
    <div><span id="end-pct">0%</span> correct</div>
    <div class="end-grade" id="end-grade">Keep Studying</div>
    <br>
    <button class="retry-btn" onclick="retryQuiz()">Retry (Shuffled) 🔄</button>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // ── J-11 PAPER (PART B) ──────────────────────────────────────────
  {
    q: "The environment source function is to:",
    options: ["Provide natural resources", "Pollute natural resources", "Prevent Natural Resource", "Cause natural disasters"],
    correct: 0,
    explanation: "The 'source function' of the environment means it provides raw materials and natural resources needed by humans and the economy."
  },
  {
    q: "The model code of conduct comes into effect:",
    options: ["After the declaration of election results", "On the day of voting", "On the day of commencement of filling of nomination papers", "When the election commission announces the election schedule"],
    correct: 3,
    explanation: "The Model Code of Conduct comes into force immediately when the Election Commission announces the election schedule, to ensure a level playing field."
  },
  {
    q: "The aim of Operation Barga was:",
    options: ["Quitting Britishers from India", "To secure sharecroppers' rights", "Joining the Kashmir in Indian Union", "Police action on Hyderabad state"],
    correct: 1,
    explanation: "Operation Barga (1978, West Bengal) was a land reform drive to register sharecroppers and secure their right to retain 75% of their produce."
  },
  {
    q: "Arrange the following in chronological order: i) Operation Blue Star ii) Formation of TDP iii) Demolition of Babri Masjid iv) Ram Janmabhoomi Rath Yatra",
    options: ["iv, iii, i, ii", "iii, iv, i, ii", "ii, i, iv, iii", "iii, ii, i, iv"],
    correct: 2,
    explanation: "TDP formed (1982) → Operation Blue Star (1984) → Rath Yatra (1990) → Babri Masjid demolition (1992) — option C: ii, i, iv, iii."
  },
  {
    q: "The Allies adopted the policy of appeasement of Hitler to:",
    options: ["Support from Hitler against Soviet and Socialism", "Take over the USSR by Germany", "Support the victims of economic depression", "Gain support from Mussolini against Germany"],
    correct: 0,
    explanation: "Britain and France appeased Hitler hoping he would turn his aggression eastward against the Soviet Union, keeping western Europe safe."
  },
  {
    q: "The Constitution of India in 1950 had:",
    options: ["395 articles and 8 schedules", "448 articles and 10 schedules", "400 articles and 8 schedules", "495 articles and 10 schedules"],
    correct: 0,
    explanation: "The original Constitution of India (1950) had 395 articles and 8 schedules; amendments have since increased these numbers."
  },
  {
    q: "Match: a) Eastern Ghats – b) The Nilgiris – c) Annamalai Hills – d) The Himalayas with i) Everest ii) Aromakonda iii) Dodabetta iv) Anaimudi",
    options: ["a-i, b-ii, c-iii, d-iv", "a-ii, b-iii, c-iv, d-i", "a-ii, b-iii, c-iv, d-i", "a-ii, b-iv, c-iii, d-i"],
    correct: 1,
    explanation: "Eastern Ghats → Aromakonda (highest); Nilgiris → Dodabetta; Annamalai Hills → Anaimudi; Himalayas → Everest."
  },
  {
    q: "Decisions relating to war and peace are taken in UNO at:",
    options: ["General Assembly", "International Court of Justice", "Security Council", "UNESCO"],
    correct: 2,
    explanation: "The UN Security Council has primary responsibility for the maintenance of international peace and security, including decisions on war and peace."
  },
  {
    q: "The minimum age considered for measuring Literacy Rate is:",
    options: ["6 Years", "14 Years", "18 Years", "7 Years"],
    correct: 3,
    explanation: "In India, the literacy rate is calculated for the population aged 7 years and above, as per Census definition."
  },
  {
    q: "Which of the following is true regarding Gross Domestic Product?",
    options: ["The total value of final and intermediate goods", "The total value of final goods", "The total value of final goods and services", "The total value of final goods, intermediate goods and services"],
    correct: 2,
    explanation: "GDP is the total monetary value of all final goods and services produced within a country in a given period; intermediate goods are excluded to avoid double counting."
  },
  {
    q: "The main reason for the 1969 Telangana agitation was:",
    options: ["Equal employment in government sector exists", "Implementation of the Mulki Rules", "The surplus revenue of Telangana was used for other regions", "Non-Local status for Coastal Andhra people in Telangana"],
    correct: 2,
    explanation: "A key grievance was that the surplus revenue generated in Telangana was diverted for development of other regions, violating the Gentlemen's Agreement."
  },
  {
    q: "Moderate rainfall in North India in winter is due to:",
    options: ["The cyclones in Arabian Sea", "A moderate rainfall in North India", "The high rainfall in Coromandel coast", "Temperature change in west coast of India"],
    correct: 1,
    explanation: "Western disturbances are extratropical cyclones originating in the Mediterranean that bring winter rainfall to northwestern and northern India."
  },
  {
    q: "National Food Security Act 2013 legalises people's:",

    explanation: "The National Food Security Act 2013 legally entitles up to 75% of the rural and 50% of the urban population to subsidised food grains, making food a legal right."

  {
    q: "Example for Indian peninsular rivers:",

    correct: 2,
    explanation: "Narmada and Tapti are classic peninsular rivers originating in the Deccan plateau; Ganga, Indus, Brahmaputra are Himalayan (perennial) rivers."
  },
  {
    q: "Which of the following is NOT an environmental movement?",
    options: ["Chipko", "Green Peace", "Meira Paibi", "Silent Valley"],
    correct: 2,
    explanation: "Meira Paibi ('torch bearers') is a women's vigilante movement in Manipur against drug abuse and human rights violations, not primarily an environmental movement."
  },
  {
    q: "The standard unit of measuring land is:",
    options: ["Acre", "Cent", "Gunta", "Hectare"],
    correct: 3,
    explanation: "Hectare is the internationally accepted standard unit for measuring land area, equal to 10,000 square metres."
  },
  {
    q: "In 1992, India's birth rate and death rate respectively were:",
    options: ["29, 19", "29, 10", "10, 19", "10, 29"],
    correct: 1,
    explanation: "In 1992, India's birth rate was approximately 29 per 1000 and death rate was approximately 10 per 1000, showing a wide gap driving population growth."
  },
  {
    q: "Match: a) Voting age reduced from 21 to 18 years b) NOTA c) India Election Commission d) The first general elections with i) 1952 ii) 1950 iii) 1988 iv) 2013",
    options: ["a-i, b-ii, c-iii, d-iv", "a-i, b-iii, c-ii, d-iv", "a-iii, b-iv, c-ii, d-i", "a-iii, b-ii, c-i, d-iv"],
    correct: 2,
    explanation: "Voting age lowered 1988 (61st Amendment); NOTA introduced 2013; Election Commission established 1950; first general elections 1952."
  },
  {
    q: "Present Finance Minister of Telangana State (as of Feb 2026):",
    options: ["Shri Mallu Batti Vikramarka", "Shri Sridhar Babu", "Shri Ponnam Prabhakar", "Shri T Nageshwar Rao"],
    correct: 0,
    explanation: "Mallu Batti Vikramarka served as the Finance Minister of Telangana in the Congress government formed after the December 2023 elections."
  },
  {
    q: "Present Rajya Sabha Chairman (as of Feb 2026):",
    options: ["Shri Jagdeep Dhankhar", "Shri Om Birla", "Shri Venkaiah Naidu", "Shri CP Radhakrishnan"],
    correct: 0,
    explanation: "Jagdeep Dhankhar, the Vice President of India, serves as the ex-officio Chairman of the Rajya Sabha. He assumed office in August 2022."
  },

  // ── PR-86 PAPER (PART B) ─────────────────────────────────────────
  {
    q: "Black soils in the Peninsular Plateau are mainly formed due to:",
    options: ["River deposition", "Volcanic activity", "Glacial erosion", "Wind deposition"],
    correct: 1,
    explanation: "Black (Regur) soils are formed from the solidification and weathering of volcanic lava of the Deccan Traps, making them rich in minerals."
  },
  {
    q: "Disguised unemployment is mainly seen in:",
    options: ["Agriculture", "IT sector", "Banking", "Transport"],
    correct: 0,
    explanation: "Disguised unemployment occurs when more people work on a task than actually needed; it is most common in agriculture in India."
  },
  {
    q: "The monsoon system develops mainly between:",
    options: ["0°-10°N latitudes", "10°-30°N latitudes", "20°N and 20°S latitudes", "30°-60° S latitudes"],

    explanation: "The monsoon system develops in the tropical belt between 20°N and 20°S latitudes where strong thermal gradients and the ITCZ drive seasonal wind reversals."
  },
  {

    options: ["Ganga and Yamuna", "Narmada and Tapati", "Indus and Brahmaputra", "Godavari and Krishna"],
    correct: 2,

  {
    q: "Sex ratio refers to:",

    explanation: "Sex ratio in India is defined as the number of females per 1000 males in the population."
  },

// ── STATE ──────────────────────────────────────────────────────────
let questions = [];
let currentIdx = 0;
let score = 0;
let selectedOption = null;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  questions = shuffle(ALL_QUESTIONS);
  currentIdx = 0;
  score = 0;
  document.getElementById('total-count').textContent = questions.length;
  showScreen('screen-quiz');
  renderQuestion();
}

function retryQuiz() {
  startQuiz();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderQuestion() {
  answered = false;
  selectedOption = null;

  const q = questions[currentIdx];
  const total = questions.length;

  document.getElementById('q-counter').textContent = `Q ${currentIdx + 1} / ${total}`;
  document.getElementById('score-display').textContent = score;
  document.getElementById('progress-fill').style.width = `${(currentIdx / total) * 100}%`;
  document.getElementById('q-num-tag').textContent = `Q${currentIdx + 1}`;
  document.getElementById('q-text').textContent = q.q;

  // Alternate rotation
  const card = document.getElementById('question-card');
  card.className = 'question-card ' + (currentIdx % 2 === 0 ? 'rotate-neg' : 'rotate-pos');

  // Options
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectOption(i);
    grid.appendChild(btn);
  });

  document.getElementById('lock-in-btn').disabled = true;
  document.getElementById('feedback-box').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
}

function selectOption(idx) {
  if (answered) return;
  selectedOption = idx;
  document.querySelectorAll('.option-btn').forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
  });
  document.getElementById('lock-in-btn').disabled = false;
}

function lockIn() {
  if (answered || selectedOption === null) return;
  answered = true;
  document.getElementById('lock-in-btn').disabled = true;

  const q = questions[currentIdx];
  const isCorrect = selectedOption === q.correct;
  const btns = document.querySelectorAll('.option-btn');

  btns.forEach(b => b.disabled = true);
  btns[q.correct].classList.add('correct');

  const fb = document.getElementById('feedback-box');
  const card = document.getElementById('question-card');

  if (isCorrect) {
    score++;
    document.getElementById('score-display').textContent = score;
    btns[selectedOption].classList.add('correct');
    fb.className = 'feedback-box correct-fb';
    document.getElementById('fb-title').textContent = 'Nice one! ✅';
    document.getElementById('fb-correct-ans').textContent = '';
    document.getElementById('fb-explain').textContent = q.explanation;
    card.classList.add('flash-green');
    setTimeout(() => card.classList.remove('flash-green'), 700);
  } else {
    btns[selectedOption].classList.add('wrong');
    fb.className = 'feedback-box wrong-fb';
    document.getElementById('fb-title').textContent = 'Not quite! ❌';
    document.getElementById('fb-correct-ans').textContent = `✅ Correct: ${q.options[q.correct]}`;
    document.getElementById('fb-explain').textContent = q.explanation;
    card.style.setProperty('--r', card.classList.contains('rotate-neg') ? '-0.5deg' : '0.5deg');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 500);
  }

  fb.style.display = 'block';
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= questions.length) {
    showEndScreen();
  } else {
    renderQuestion();
  }
}

function showEndScreen() {
  showScreen('screen-end');
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('end-score').textContent = `${score} / ${total}`;
  document.getElementById('end-pct').textContent = `${pct}%`;

  const gradeEl = document.getElementById('end-grade');
  if (pct >= 80) {
    gradeEl.textContent = '🏆 Excellent!';
    gradeEl.className = 'end-grade grade-excellent';
  } else if (pct >= 50) {
    gradeEl.textContent = '👍 Good job!';
    gradeEl.className = 'end-grade grade-good';
  } else {
    gradeEl.textContent = '📖 Keep Studying!';
    gradeEl.className = 'end-grade grade-keep';
  }
  document.getElementById('progress-fill').style.width = '100%';
}

// ── KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const screen = document.querySelector('.screen.active').id;
  if (screen !== 'screen-quiz') return;
  if (['1','2','3','4'].includes(e.key)) selectOption(parseInt(e.key) - 1);
  if (e.key === 'Enter') {
    if (!answered && selectedOption !== null) lockIn();
    else if (answered) nextQuestion();
  }
});

// INIT
document.getElementById('total-count').textContent = ALL_QUESTIONS.length;
</script>
</body>
